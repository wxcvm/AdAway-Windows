name: Request signed Windows v1.75 final installer
on:
  push:
    branches: [release-request/windows-v175-d-drive-20261017]
    paths: ['.github/workflows/request-signed-v175-d-drive.yml']
permissions:
  contents: read
  actions: write
jobs:
  signed-release-request:
    if: github.repository == 'wxcvm/AdAway-Windows'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_PFX: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
      ORIGINAL_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - name: Require original trusted signing identity
        run: |
          if [ -z "$ORIGINAL_PFX" ] || [ -z "$ORIGINAL_PASSWORD" ]; then
            echo "::error::Original Windows signing PFX/password are not configured. A genuine signed stable installer cannot be published."
            exit 1
          fi
          echo "Original signing secret names are configured; no secret values printed"
      - name: Require passing main build of exact approved installer change
        run: |
          set -euo pipefail
          gh run watch 39017134748 --repo "$GITHUB_REPOSITORY" --exit-status
          expected=bdd6bf04b9003ef299b31f52e687ce61aa11733d
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          [ "$head" = "$expected" ] || { echo "::error::Main changed; refusing to publish a different build"; exit 1; }
          source=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39017134748" --jq '.head_sha')
          [ "$source" = "$expected" ] || { echo "::error::Tested source does not match official main"; exit 1; }
          if gh release view win11-webserver-v1.75 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v1.75 release already exists; refusing to overwrite"
            exit 1
          fi
      - name: Launch original signed official release workflow
        run: |
          set -euo pipefail
          gh workflow run windows-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Official Windows installer release build was dispatched; signing/parity checks remain mandatory."
