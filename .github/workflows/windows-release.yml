name: Windows 11 webserver release

on:
  # Main-branch merges run CI only; publishing requires manual dispatch.
  workflow_dispatch:
  pull_request:
    branches: [ main, feat/dns-aaaa-diagnostics-v1, feat/dns-tcp-diagnostics-v1, feat/typed-rule-provenance-v1, feat/traffic-mode-foundation, feat/core-contract-v1, feat/rule-loader-atomic-v1 ]
  push:
    tags: ['progress-win-*']
    branches: [ main, 'preview/release-*' ]
    # 本仓库只放 Windows 端文件（12 个在根目录），因此不再用 paths 过滤：
    # 原先三条路径是 AdAway 仓库的布局，迁出后永远匹配不到，会让代码改动的推送完全不触发 CI。

permissions:
  contents: write

jobs:
  build:
    concurrency:
      group: windows-${{ (startsWith(github.ref, 'refs/tags/progress-win-') || startsWith(github.ref, 'refs/heads/preview/release-')) && 'preview-publication' || github.run_id }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Single source of truth for the release tag: the installer attach step
      # used to hardcode the tag, so every version bump uploaded the new
      # installer onto the PREVIOUS release and the new one shipped zip-only.
      TAG: win11-webserver-v1.84
      # User-approved temporary release policy: unsigned Windows distributions.
      # Switch to '0' only after trusted Authenticode release signing is ready.
      WINDOWS_UNSIGNED_RELEASE: '1'
      ADBLOCK_PREVIEW_BUILD: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      ADBLOCK_INPLACE_PREVIEW: ${{ (startsWith(github.ref, 'refs/tags/progress-win-') || startsWith(github.ref, 'refs/heads/preview/release-')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Fail within seconds on preview refs if the original signing identity
      # is missing. Previously a preview spent minutes compiling OpenSSL and
      # packaging before discovering it could not be signed or published.
      # Never print the PFX or password. Real signature and production signer
      # parity are still checked after the executable and installers exist.
      - name: Preflight original Windows signing credentials for preview
        if: env.WINDOWS_UNSIGNED_RELEASE != '1' && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/progress-win-') || startsWith(github.ref, 'refs/heads/preview/release-'))
        shell: bash
        env:
          EXISTING_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          EXISTING_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${EXISTING_CERT_PFX:-}" || -z "${EXISTING_CERT_PASSWORD:-}" ]]; then
            echo "::error::Preview publication requires the original WINDOWS_CERT_PFX_B64 and WINDOWS_CERT_PASSWORD secrets. No build or release was published."
            exit 1
          fi
          echo "Original production signing credentials supplied; actual certificate verification remains mandatory."

      - name: Set up MSYS2 (mingw64 + OpenSSL)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          # update: true runs a full "pacman -Syu" and cost 56 s per run; the
          # action's cache (on by default) already carries the toolchain, and
          # the packages below are installed with --needed. Flip this back to
          # true if a run ever fails on a stale package database.
          update: false
          install: >-
            git
            make
            perl
            python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkg-config

      - name: Check Windows update feed ownership
        shell: bash
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          src = '\n'.join(Path(path).read_text(encoding="utf-8") for path in ['update_win32.c','update_feed.c'])
          required = [
              '/repos/wxcvm/AdAway-Windows/releases?per_page=100',
              '/wxcvm/AdAway-Windows/releases/download/win11-latest/windows-manifest.json',
              'https://api.github.com/repos/wxcvm/AdAway-Windows/releases/assets/%s',
              'https://github.com/wxcvm/AdAway-Windows/releases',
          ]
          for target in required:
              assert target in src, "Windows update feed path missing: " + target
          assert '/wxcvm/AdAway/releases' not in src
          assert '/repos/wxcvm/AdAway/releases' not in src
          print("All Windows update paths point at AdAway-Windows")
          PYEOF

      - name: Test persistent Windows network journal store
        shell: msys2 {0}
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            windows_network_journal.c windows_network_journal_store_win32.c \
            windows_network_journal_store_win32_test.c \
            -o windows_network_journal_store_win32_test.exe -municode -lcrypt32 -ladvapi32 -lbcrypt
          ./windows_network_journal_store_win32_test.exe

      - name: Test fixed upstream acquisition and local-cache preservation
        shell: bash
        run: bash tests/fetch-upstream-test.sh

      - name: Test atomic subscription source settings and save rollback
        shell: msys2 {0}
        run: |
          python tools/check-control-ids.py
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic subscription_settings_win32.c subscription_settings_win32_test.c -o subscription_settings_win32_test.exe
          ./subscription_settings_win32_test.exe
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic subscription_settings_win32.c subscription_display_win32.c subscription_display_win32_test.c -o subscription_display_win32_test.exe -lwinhttp
          ./subscription_display_win32_test.exe
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic policy_settings_win32.c policy_settings_win32_test.c -o policy_settings_win32_test.exe
          ./policy_settings_win32_test.exe

      - name: Test pinned shared rule and native core contracts
        shell: msys2 {0}
        run: |
          bash fetch-core-contract.sh
          python tools/verify-listener-contract.py
          python tools/verify-arrival-contract.py
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic shared-contract/domain_rule_snapshot_test.c -o domain_rule_snapshot_test.exe -lws2_32
          directory=$(mktemp -d)
          ./domain_rule_snapshot_test.exe shared-contract/source_loader_vectors.txt "$directory"
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic shared-contract/block_rule_snapshot_test.c -o block_rule_snapshot_test.exe -lws2_32
          ./block_rule_snapshot_test.exe
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic shared-contract/typed_rule_snapshot_test.c -o typed_rule_snapshot_test.exe -lws2_32
          ./typed_rule_snapshot_test.exe shared-contract/typed_rule_vectors.tsv
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Ishared-contract subscription_update_win32.c subscription_update_win32_test.c -o subscription_update_win32_test.exe -lws2_32
          ./subscription_update_win32_test.exe
          gcc -std=c11 -Wall -Wextra -Werror -pedantic listen_address_test.c -lws2_32 -o listen_address_test.exe
          ./listen_address_test.exe
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -I. tools/listen-owner-probe.c -lws2_32 -liphlpapi -o listen-owner-probe.exe
          python tools/test-listen-owner.py ./listen-owner-probe.exe
          gcc -std=c11 -Wall -Wextra -Werror -pedantic update_package_policy_test.c -o update_package_policy_test.exe
          ./update_package_policy_test.exe
          gcc -std=c11 -Wall -Wextra -Werror -pedantic control_http_result_test.c -o control_http_result_test.exe
          ./control_http_result_test.exe
          gcc -std=c11 -Wall -Wextra -Werror -pedantic managed_listener_address_test.c -lws2_32 -liphlpapi -ladvapi32 -o managed_listener_address_test.exe
          ./managed_listener_address_test.exe
          gcc -std=c11 -Wall -Wextra -Werror -pedantic listener_pair_test.c -lws2_32 -o listener_pair_test.exe
          ./listener_pair_test.exe
          gcc -std=c11 -Wall -Wextra -Werror -pedantic listener_startup_test.c -lws2_32 -liphlpapi -ladvapi32 -lshell32 -o listener_startup_test.exe
          ./listener_startup_test.exe
          gcc -std=c11 -Wall -Wextra -Werror -pedantic shared-contract/traffic_core_contract_test.c -o core_contract_test.exe
          ./core_contract_test.exe shared-contract/traffic_core_vectors.txt
          gcc -std=c11 -Wall -Wextra -Werror -pedantic shared-contract/rule_norm_test.c -o rule_norm_test.exe
          ./rule_norm_test.exe shared-contract/rule_vectors.txt

      - name: Test isolated dual-stack forwarding and cancellation recovery
        shell: msys2 {0}
        run: |
          bash fetch-transport-contract.sh
          python3 tools/test-transport-contract.py
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic transport-contract/diagnostic_udp_packet_test.c -o transport-packet-test.exe
          ./transport-packet-test.exe transport-contract/packet_vectors.tsv
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Itransport-contract isolated_transport_win32.c isolated_transport_win32_test.c -o isolated_transport_win32_test.exe -lws2_32 -lbcrypt
          ./isolated_transport_win32_test.exe
          bash fetch-tcp-contract.sh
          python3 tools/test-tcp-contract.py
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic tcp-contract/diagnostic_socks5_test.c -o tcp-contract-test.exe
          ./tcp-contract-test.exe tcp-contract/socks5_vectors.tsv
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Itcp-contract isolated_tcp_win32.c isolated_tcp_win32_test.c -o isolated_tcp_win32_test.exe -lws2_32 -lbcrypt
          ./isolated_tcp_win32_test.exe

      - name: Test rule-driven DNS wire responses (core action parity)
        shell: msys2 {0}
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ishared-contract dns_policy_wire.c dns_policy_wire_test.c -o dns_policy_wire_test.exe -lws2_32
          ./dns_policy_wire_test.exe

      - name: Build bounded loopback DNS diagnostic and pinned reply contract
        shell: msys2 {0}
        run: |
          bash fetch-dns-contract.sh
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('dns-contract'); header=root/'diagnostic_dns_reply.h'; manifest=root/'manifest.json'
          original=header.read_bytes(); saved=manifest.read_bytes()
          try:
              header.write_bytes(original+b'\n/* modified cached contract */\n')
              document=json.loads(saved)
              document['files'][header.name]=hashlib.sha256(header.read_bytes()).hexdigest()
              manifest.write_text(json.dumps(document))
              assert subprocess.run(['bash','fetch-dns-contract.sh'],capture_output=True).returncode!=0
          finally:
              header.write_bytes(original); manifest.write_bytes(saved)
          print('Modified cache plus matching manifest correctly rejected')
          PY
          bash fetch-dns-contract.sh
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic dns-contract/diagnostic_dns_reply_test.c -o diagnostic_dns_reply_test.exe
          ./diagnostic_dns_reply_test.exe dns-contract/diagnostic_dns_vectors.tsv
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Ishared-contract -Idns-contract -I. \
            dns_probe_win32.c dns_policy_wire.c dns_probe_cancel_test.c -o dns_probe_cancel_test.exe -lws2_32
          ./dns_probe_cancel_test.exe
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Ishared-contract -Idns-contract -I. \
            dns_probe_win32.c dns_policy_wire.c tools/dns-loopback-probe.c -o dns-loopback-probe.exe -municode -static-libgcc -lws2_32
          objdump -p dns-loopback-probe.exe | grep 'DLL Name:'
          if objdump -p dns-loopback-probe.exe | grep -Eiq 'DLL Name:.*(libgcc|libwinpthread|msys-|cygwin)'; then
            echo 'Diagnostic requires development runtime DLLs'; exit 1
          fi

      - name: Verify real rule import and bounded UDP-to-TCP loopback exchanges
        shell: pwsh
        timeout-minutes: 2
        run: |
          $fixtureTemp = Join-Path $env:RUNNER_TEMP 'dns-probe-fixture'
          New-Item -ItemType Directory -Force -Path $fixtureTemp | Out-Null
          $env:TMP = $fixtureTemp
          $env:TEMP = $fixtureTemp
          python tools/test-dns-loopback.py ./dns-loopback-probe.exe > dns-loopback-results.json
          if ($LASTEXITCODE -ne 0) { throw 'Loopback DNS regression failed' }

      - name: Upload isolated DNS diagnostic tool and evidence
        uses: actions/upload-artifact@v4
        with:
          name: dns-tcp-diagnostics
          path: |
            dns-loopback-probe.exe
            dns-loopback-results.json
            dns-contract/manifest.json
            dns-contract/diagnostic_dns_vectors.tsv
            dns-contract/diagnostic_dns_policy_vectors.tsv
            docs/dns-tcp-diagnostics.md
          if-no-files-found: error

      - name: Test optional Wintun discovery does not execute DLL code
        shell: msys2 {0}
        run: |
          test ! -e wintun.dll
          test ! -e wintun_test_dependency.dll
          trap 'rm -f wintun.dll wintun_test_dependency.dll wintun_probe_win32_test.exe' EXIT
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -shared tests/wintun_probe_fake.c -o wintun.dll
          gcc -std=c11 -Wall -Wextra -Werror -pedantic wintun_probe_win32.c wintun_probe_win32_test.c -o wintun_probe_win32_test.exe
          ./wintun_probe_win32_test.exe
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -shared -DWINTUN_TEST_FORWARD_ONLY \
            tests/wintun_probe_fake.c tests/wintun_probe_forwarded.def -o wintun.dll
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -shared -DWINTUN_TEST_FORWARD_ONLY \
            -DWINTUN_TEST_DEPENDENCY tests/wintun_probe_fake.c -o wintun_test_dependency.dll
          ./wintun_probe_win32_test.exe
          printf 'malformed' > wintun.dll
          ./wintun_probe_win32_test.exe malformed

      - name: Test Windows network undo journal
        shell: msys2 {0}
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            windows_network_journal.c windows_network_journal_test.c \
            -o windows_network_journal_test.exe
          ./windows_network_journal_test.exe

      - name: Test Windows capture preflight
        shell: msys2 {0}
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            windows_capture_plan.c windows_capture_plan_test.c \
            -o windows_capture_plan_test.exe
          ./windows_capture_plan_test.exe

      - name: Test AdGuard Home coexistence preflight
        shell: msys2 {0}
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            adguard_home_plan.c adguard_home_plan_test.c \
            -o adguard_home_plan_test.exe
          ./adguard_home_plan_test.exe

      - name: Test traffic mode decisions (no network changes)
        shell: msys2 {0}
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            traffic_mode_policy.c traffic_mode_policy_test.c \
            -o traffic_mode_policy_test.exe
          ./traffic_mode_policy_test.exe

      - name: Cache verified official OpenSSL static archives
        uses: actions/cache@v4
        with:
          # Cache only installed public headers and archives; never runtime
          # certificates, private keys, or downloaded third-party DLLs.
          path: .openssl-build/install
          key: official-openssl-3.5.9-msys2-mingw64-${{ runner.os }}-${{ hashFiles('scripts/build-official-openssl.sh') }}

      - name: Check pinned official OpenSSL static build
        shell: bash
        run: |
          grep -Fq 'openssl-3.5.9' scripts/build-official-openssl.sh
          grep -Fq '45e844fa2a14ec92d146bd8f5778ac130b6625fb' scripts/build-official-openssl.sh
          grep -Fq 'libcrypto.a' build.sh
          ! grep -Eq '^[[:space:]]*-lssl |^[[:space:]]*-lcrypto ' build.sh

      - name: Assert version consistency (header / installer / TAG)
        shell: bash
        run: |
          HDR_VER=$(sed -n 's/.*#define ADBLOCK_APP_VERSION "\([^"]*\)".*/\1/p' gui_win32.h | head -1)
          ISS_VER=$(sed -n 's/^AppVersion=\(.*\)$/\1/p' installer.iss | head -1)
          TAG_VER="${TAG#win11-webserver-v}"
          echo "gui_win32.h=$HDR_VER installer.iss=$ISS_VER TAG=$TAG"
          if [ -z "$HDR_VER" ] || [ "$HDR_VER" != "$ISS_VER" ] || [ "$HDR_VER" != "$TAG_VER" ]; then
            echo "::error::version mismatch (header=$HDR_VER installer=$ISS_VER tag=$TAG_VER)"; exit 1
          fi

      # Regression guard for a bug that silently broke the entire updater:
      # with -std=c11 MinGW-w64 enables its ANSI stdio, so in a *wide* printf
      # %s means char* and %ls means wchar_t*. Formatting a wchar_t* with %s
      # stops at the first NUL byte, so "C:\...\adblock-update-....zip" became
      # the relative path "Cadblock-update-...." - the download then failed with
      # ERROR_ACCESS_DENIED whenever the process had not been started from a
      # writable working directory, and the same mistake garbled GUI status
      # text. Keep the specifiers honest.
      - name: Check wide-printf specifiers (%ls for wide strings)
        shell: bash
        run: |
          # 该检查要读 C 核心（jni/webserver.c），所以先取出上游；脚本幂等，后面再调不会重复取。
          bash fetch-upstream.sh
          python3 - <<'PYEOF'
          import re, sys
          files = ['jni/webserver.c',
                   'gui_win32.c',
                   'update_win32.c']
          bad = 0
          for path in files:
              try:
                  src = open(path, encoding='utf-8', errors='replace').read()
              except FileNotFoundError:
                  # 迁出后 C 服务端核心由后面的取核心步骤拉取，本步骤跑在它之前，
                  # 因此文件可能还不存在 —— 跳过并说明，而不是报错；
                  # 取核心那一步自己会断言 webserver.c 存在且大于 100KB。
                  print(f"skip (not present yet): {path}")
                  continue
              for m in re.finditer(r'(?<![\w_])swprintf\s*\(', src):
                  i, depth = m.end() - 1, 0
                  while i < len(src):
                      ch = src[i]
                      if ch == '"':
                          i += 1
                          while i < len(src) and src[i] != '"':
                              i += 2 if src[i] == '\\' else 1
                      elif ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              break
                      i += 1
                  call = src[m.start():i + 1]
                  if re.search(r'%(?!l|h|%)s', call):
                      line = src.count('\n', 0, m.start()) + 1
                      print('::error file=%s,line=%d::swprintf() uses %%s for a wide string; '
                            'use %%ls (MinGW ANSI stdio: %%s is char*)' % (path, line))
                      bad += 1
          if bad:
              sys.exit(1)
          print('wide-printf specifiers OK')
          PYEOF

      - name: Test opt-in preview and stable update manifest selection
        shell: msys2 {0}
        run: |
          python3 tools/test-preview-channel.py
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ijni -c update_feed.c update_feed_test.c
          gcc -std=c11 -O2 -DMG_TLS=0 -DMG_ENABLE_LOG=0 -c jni/mongoose/mongoose.c -o update_mongoose.o
          gcc update_feed.o update_feed_test.o update_mongoose.o -o update_feed_test.exe -lws2_32
          ./update_feed_test.exe tests/fixtures/windows-stable-manifest.json
          gcc -std=c11 -Wall -Wextra -Wno-unused-function -Wno-unused-parameter -Ijni update_channel_integration_test.c update_feed.o update_mongoose.o -o update_channel_integration_test.exe -lws2_32 -lwinhttp -lbcrypt -lwintrust -lcrypt32 -ladvapi32 -lshell32
          ./update_channel_integration_test.exe
          python tools/embed-portable-updater.py --check
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic tools/update-portable-fixture.c -o update_portable_fixture.exe

      - name: Test isolated portable update restart and rollback
        shell: powershell
        run: ./tools/test-portable-updater.ps1 -FixtureExecutable ./update_portable_fixture.exe

      - name: Upload portable update fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-update-fixture-diagnostics
          path: ${{ runner.temp }}/AdAwayPortable-*/**/*.log
          if-no-files-found: warn

      - name: Test dashboard HTTP responses with actual Mongoose
        shell: msys2 {0}
        run: |
          gcc -std=c11 -O2 -DMG_TLS=0 -DMG_ENABLE_IPV6=1 -Ijni -c jni/mongoose/mongoose.c -o dashboard_mongoose.o
          gcc -std=c11 -O2 -DMG_TLS=0 -DMG_ENABLE_IPV6=1 -Wall -Wextra -Werror -pedantic -Ijni dashboard_response_test.c dashboard_mongoose.o -o dashboard_response_test.exe -lws2_32 -lbcrypt
          ./dashboard_response_test.exe
          python3 tools/dashboard-apps-fixture.py .build-core/dashboard-apps-test.c
          gcc -std=c11 -O2 -DMG_TLS=0 -DMG_ENABLE_IPV6=1 -Wall -Wextra -Werror -pedantic -Ijni .build-core/dashboard-apps-test.c dashboard_mongoose.o -o dashboard-apps-test.exe -lws2_32 -lbcrypt
          ./dashboard-apps-test.exe
          python3 tools/dashboard-publication-fixture.py .build-core/dashboard-publication-test.c
          gcc -std=c11 -O2 -DMG_TLS=0 -DMG_ENABLE_IPV6=1 -Wall -Wextra -Werror -pedantic -I. -Ijni .build-core/dashboard-publication-test.c dashboard_mongoose.o -o dashboard-publication-test.exe -lws2_32 -lbcrypt
          ./dashboard-publication-test.exe
          gcc -std=c11 -O2 -DMG_TLS=0 -DMG_ENABLE_IPV6=1 -Wall -Wextra -Werror -pedantic -Ijni query_log_page_test.c dashboard_mongoose.o -o query_log_page_test.exe -lws2_32 -lbcrypt
          ./query_log_page_test.exe
          gcc -std=c11 -O2 -DMG_TLS=0 -DMG_ENABLE_IPV6=1 -Wall -Wextra -Werror -pedantic -Ijni query_log_navigation_test.c dashboard_mongoose.o -o query_log_navigation_test.exe -lws2_32 -lbcrypt
          ./query_log_navigation_test.exe
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic query_log_filter_test.c -o query_log_filter_test.exe
          ./query_log_filter_test.exe
          gcc -std=c11 -O2 -DMG_TLS=0 -DMG_ENABLE_IPV6=1 -Wall -Wextra -Werror -pedantic -I. -Ijni tools/query-log-client-probe.c dashboard_mongoose.o -o query-log-client-probe.exe -lws2_32 -lbcrypt

      - name: Test pinned query log contract and atomic Windows persistence
        shell: msys2 {0}
        run: |
          bash fetch-log-contract.sh
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic log-contract/request_host_test.c -o request_host_test.exe
          ./request_host_test.exe
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic query_log_atomic_win32_test.c -o query_log_atomic_win32_test.exe
          ./query_log_atomic_win32_test.exe "$(cygpath -m "$RUNNER_TEMP")"
          gcc -std=c11 -O2 -DMG_TLS=0 -DMG_ENABLE_IPV6=1 -Wall -Wextra -Werror -pedantic -Ijni -Ilog-contract log-contract/query_log_store_test.c dashboard_mongoose.o -o query_log_store_test.exe -lws2_32 -lbcrypt
          ./query_log_store_test.exe "$(cygpath -m "$RUNNER_TEMP")"
          python3 tools/build-rule-core.py jni/webserver.c .build-core/stats-bounds-core.c
          python3 log-contract/stats-json-bounds-fixture.py .build-core/stats-bounds-core.c .build-core/stats-bounds-test.c
          gcc -std=c11 -O2 -DMG_TLS=0 -DMG_ENABLE_IPV6=1 -Wall -Wextra -Werror -pedantic -Ijni .build-core/stats-bounds-test.c dashboard_mongoose.o -o stats-bounds-test.exe -lws2_32 -lbcrypt
          ./stats-bounds-test.exe

      - name: Prepare resources (convert block placeholder images to webp)
        shell: bash
        run: |
          # 上游资源不在本仓库：按固定提交从 AdAway 取出 C 核心与 webroot 资源。
          # 注意目的路径保持和 AdAway 一致（jni/ 与 app/src/main/assets/），这样本工作流
          # 其余步骤无需改动；只取一次，已存在则跳过。
          bash fetch-upstream.sh
          # Only install when Pillow is really missing: this step used to pay
          # ~10 s of pip resolution on every run.
          python3 -c "import PIL" 2>/dev/null \
            || python3 -m pip install --quiet pillow \
            || pip3 install --quiet pillow
          python3 - <<'PYEOF'
          import glob, os
          from PIL import Image
          for p in glob.glob('app/src/main/assets/img_*'):
              if p.endswith('.webp'):
                  continue
              name = os.path.basename(p)
              base = name.rsplit('.', 1)[0]
              im = Image.open(p).convert('RGB')
              w, h = im.size
              scale = min(1.0, 800 / max(w, h))
              if scale < 1.0:
                  im = im.resize((int(w * scale), int(h * scale)), Image.LANCZOS)
              out = f'app/src/main/assets/{base}.webp'
              im.save(out, 'WEBP', quality=95, method=6)
              os.remove(p)
              print(f'{name} ({w}x{h}) -> {out}')
          print('block images converted')
          PYEOF
          mkdir -p resources
          cp app/src/main/assets/img_*.webp resources/ || true
          cp app/src/main/assets/test.html resources/
          python3 - <<'PYEOF'
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (300, 120), (25, 118, 210))
          d = ImageDraw.Draw(img)
          d.rectangle([8, 8, 292, 112], outline='white', width=4)
          d.text((36, 48), 'ADBlock', fill='white')
          img.save('resources/icon.png')
          PYEOF
          # Multi-size application icon embedded into webserver.exe (windres).
          python3 - <<'PYEOF'
          from PIL import Image, ImageDraw
          S = 256
          img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([8, 8, S - 8, S - 8], radius=54, fill=(37, 99, 235, 255))
          d.ellipse([56, 56, S - 56, S - 56], outline=(255, 255, 255, 255), width=22)
          d.line([82, 174, 174, 82], fill=(255, 255, 255, 255), width=22)
          img.save('app.ico',
                   sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
          print('app.ico written')
          PYEOF
          echo "resources:" && ls -la resources

      # C 服务端核心不在本仓库：从 AdAway 仓库的**固定提交**取出 webserver/jni，避免复制两份后漂移。
      # 提交号写死在这里，升级是有意识的动作（配合 docs/windows-core-contract.md 的契约）。
      - name: Build webserver.exe (mingw64 + OpenSSL)
        shell: msys2 {0}
        run: |
          chmod +x build.sh
          ./build.sh
          cp -r resources dist/resources
          cp README.txt dist/README.txt
          cp start.bat dist/start.bat

      - name: Test actual server history with production desktop page parser
        shell: pwsh
        timeout-minutes: 3
        run: |
          python tools/test-query-log-server.py dist/webserver.exe query-log-client-probe.exe > query-log-server-results.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual query log server/client integration failed' }
          Get-Content query-log-server-results.json

      - name: Preserve actual query log server results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-query-log-server
          path: query-log-server-results.json
          if-no-files-found: warn

      - name: Build strict HTTPS arrival client using the pinned OpenSSL
        shell: msys2 {0}
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -I.openssl-build/install/include \
            listener_arrival_win32.c listener_tls_win32.c listener_arrival_win32_test.c traffic_observer_win32.c \
            .openssl-build/install/lib/libssl.a .openssl-build/install/lib/libcrypto.a \
            -lws2_32 -liphlpapi -ladvapi32 -lbcrypt -lcrypt32 -o listener-arrival-probe.exe
          ./listener-arrival-probe.exe

      # The build script used to rely on MinGW's defaults for the PE
      # mitigations, so nothing noticed if they were absent. Assert them (and
      # the stack protector) here: this runs before any release is published,
      # so a failure is free.
      - name: Assert PE mitigations (ASLR / NX / high-entropy VA / stack protector)
        shell: msys2 {0}
        run: |
          EXE=dist/webserver.exe
          DLLCHAR=$(objdump -p "$EXE" | sed -n 's/^[[:space:]]*DllCharacteristics[[:space:]]*\([0-9a-fA-F]*\)$/\1/p' | head -1)
          echo "DllCharacteristics=0x$DLLCHAR"
          if [ -z "$DLLCHAR" ]; then
            echo "::error::could not read DllCharacteristics from $EXE"; exit 1
          fi
          for bit in 20 40 100; do
            if [ $(( 0x$DLLCHAR & 0x$bit )) -eq 0 ]; then
              echo "::error::webserver.exe lacks PE mitigation bit 0x$bit (HIGH_ENTROPY_VA=0x20, DYNAMIC_BASE=0x40, NX_COMPAT=0x100)"
              exit 1
            fi
          done
          if ! objdump -t "$EXE" | grep -q '__stack_chk_fail'; then
            # A warning, not an error: this only proves that GCC emitted the
            # canary call, and the symbol is not guaranteed to be visible in
            # every objdump/symbol-table combination. The release is still
            # blocked below if the PE mitigation bits are missing.
            echo "::warning::webserver.exe has no __stack_chk_fail reference - check that -fstack-protector-strong is still applied"
          fi
          echo "PE mitigations OK"

      - name: Smoke test (start server, fetch stats + test page)
        shell: pwsh
        run: |
          $res = (Resolve-Path "dist\resources").Path
          $proc = Start-Process -FilePath "dist\webserver.exe" -ArgumentList @("--resources",$res,"--http-port","18080","--https-port","18443","--no-gui") -PassThru -WorkingDirectory "dist" -RedirectStandardOutput "server.log" -RedirectStandardError "server.err"
          # Poll for the first answer instead of sleeping a fixed 7 s: the
          # server binds in well under a second, so the old wait was dead time
          # (and still failed on a slow runner).
          $stats = $null
          $deadline = (Get-Date).AddSeconds(25)
          while (-not $stats -and (Get-Date) -lt $deadline) {
            if ($proc.HasExited) {
              Write-Output ("SERVER EXITED with code " + $proc.ExitCode)
              Write-Output "---- stdout tail ----"
              Get-Content "server.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
              Write-Output "---- stderr tail ----"
              Get-Content "server.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
              throw "webserver exited before smoke test"
            }
            try {
              $stats = Invoke-WebRequest -Uri "http://127.0.0.1:18080/internal-stats" -UseBasicParsing -TimeoutSec 5
            } catch {
              Start-Sleep -Milliseconds 250
            }
          }
          if (-not $stats) { throw "no answer on http://127.0.0.1:18080/internal-stats within 25s" }
          try {
            Write-Output "internal-stats HTTP $($stats.StatusCode): $($stats.Content.Substring(0, [Math]::Min(180, $stats.Content.Length)))"
            $test = Invoke-WebRequest -Uri "http://127.0.0.1:18080/internal-test" -UseBasicParsing -TimeoutSec 10
            Write-Output "internal-test HTTP $($test.StatusCode)"
            if (-not (Test-Path "dist\resources\localhost-2410.crt")) { throw "CA certificate not generated" }
            $https = Invoke-WebRequest -Uri "https://127.0.0.1:18443/internal-test" -SkipCertificateCheck -UseBasicParsing -TimeoutSec 10
            Write-Output "https internal-test HTTP $($https.StatusCode)"
            if ($stats.StatusCode -ne 200 -or $test.StatusCode -ne 200 -or $https.StatusCode -ne 200) { throw "smoke test failed" }
            # v1.11: /internal-stats must carry the listener table so the
            # dashboard can show which sockets are really bound.
            $json = $stats.Content
            if ($json -notmatch '"listeners"\s*:\s*\[') { throw "internal-stats has no listeners[] array" }
            if ($json -notmatch '"bind_ok"\s*:\s*true') { throw "internal-stats reports bind_ok=false" }
            if ($json -notmatch '"stats_port"\s*:\s*8686') { throw "internal-stats has no stats_port" }
            $mgmt = Invoke-WebRequest -Uri "http://127.0.0.1:8686/internal-stats" -UseBasicParsing -TimeoutSec 10
            Write-Output ("management port /internal-stats HTTP " + $mgmt.StatusCode)
            if ($mgmt.StatusCode -ne 200) { throw "management port not reachable" }
            # v1.29 per-app attribution: /internal-* traffic is excluded from the
            # counters by design, so send one normal request first. The client is
            # this PowerShell process, so its name must resolve to an .exe and the
            # request must show up in apps[].
            $null = Invoke-WebRequest -Uri "http://127.0.0.1:18080/ci-probe" -UseBasicParsing -TimeoutSec 10
            $json2 = (Invoke-WebRequest -Uri "http://127.0.0.1:18080/internal-stats" -UseBasicParsing -TimeoutSec 10).Content
            if ($json2 -notmatch '"apps":\[\{') { throw "internal-stats apps[] is empty" }
            if ($json2 -notmatch '"name":"[^"]*\.exe","connections":\d+,"requests":[1-9]') {
              throw "apps[] has no process-attributed request (per-app attribution broken)"
            }
            if ($json2 -notmatch '"query_log":\[') { throw "internal-stats has no query_log[] array" }
            # v1.59: the ranking needs the field to exist even when nothing has
            # been blocked yet - an absent array is what left the Android
            # "拦截排行" card permanently empty.
            if ($json2 -notmatch '"top_blocked":\[') { throw "internal-stats has no top_blocked[] array" }
            Write-Output ("per-app attribution OK: " + ([regex]::Match($json2, '"apps":\[\{[^}]*\}')).Value)
          } catch {
            Write-Output "SMOKE TEST ERROR: $($_.Exception.Message)"
            Write-Output "---- stdout tail ----"
            Get-Content "server.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
            Write-Output "---- stderr tail ----"
            Get-Content "server.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
            throw
          } finally {
            Get-Process -Name webserver -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          # Phase 2 - double-click simulation: no --resources (defaults to
          # the "resources" folder next to the exe, auto-created), only
          # explicit free ports so the test never collides with the first one.
          $p2 = Start-Process -FilePath "dist\webserver.exe" -ArgumentList @("--http-port","18081","--https-port","18444","--no-gui") -PassThru -WorkingDirectory "dist" -RedirectStandardOutput "server2.log" -RedirectStandardError "server2.err"
          $s2 = $null
          $deadline2 = (Get-Date).AddSeconds(25)
          while (-not $s2 -and (Get-Date) -lt $deadline2) {
            if ($p2.HasExited) {
              Write-Output ("NO-ARGS SERVER EXITED with code " + $p2.ExitCode)
              Get-Content "server2.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
              Get-Content "server2.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
              throw "no-args webserver exited"
            }
            try {
              $s2 = Invoke-WebRequest -Uri "http://127.0.0.1:18081/internal-stats" -UseBasicParsing -TimeoutSec 5
            } catch {
              Start-Sleep -Milliseconds 250
            }
          }
          try {
            if (-not $s2) { throw "no-args server never answered on 18081" }
            Write-Output ("no-args mode internal-stats HTTP " + $s2.StatusCode)
            if ($s2.StatusCode -ne 200) { throw "no-args smoke test failed" }
          } catch {
            Write-Output ("NO-ARGS SMOKE TEST ERROR: " + $_.Exception.Message)
            Get-Content "server2.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
            Get-Content "server2.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
            throw
          } finally {
            Get-Process -Name webserver -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: GUI mode smoke test (process must stay alive, not die silently)
        timeout-minutes: 3
        shell: pwsh
        run: |
          # Keep fixture URLs AND persisted GUI preferences outside packaged dist.
          $uiRoot = Join-Path $env:RUNNER_TEMP 'adblock-ui-inspection'
          New-Item -ItemType Directory -Force -Path $uiRoot | Out-Null
          Copy-Item -Path 'dist/*' -Destination $uiRoot -Recurse -Force
          Set-Content (Join-Path $uiRoot 'webserver.ini') "[settings]`nautomatic_update=0" -Encoding ascii
          $res3 = Join-Path $uiRoot 'resources'
          # Offline fixture: management / selection only, no update is triggered.
          Set-Content -LiteralPath (Join-Path $res3 'subscription_urls.txt') -Encoding utf8 -Value @('https://example.test/hosts','https://example.test/allow')
          Set-Content -LiteralPath (Join-Path $res3 'subscriptions.txt') -Encoding utf8 -Value 'ads.removal-fixture.invalid'
          $uiExecutable = Join-Path $uiRoot 'webserver.exe'
          $p3 = Start-Process -FilePath $uiExecutable -ArgumentList @("--resources",$res3,"--http-port","18083","--https-port","18446") -PassThru -WorkingDirectory $uiRoot -RedirectStandardOutput "server3.log" -RedirectStandardError "server3.err"
          # Wait for the GUI process to serve its main port, then make sure it
          # is still alive a moment later: proves the dashboard thread and the
          # server thread coexist, without the old fixed 8 s wait.
          $alive = $null
          $deadline3 = (Get-Date).AddSeconds(25)
          while (-not $alive -and (Get-Date) -lt $deadline3) {
            if ($p3.HasExited) {
              Write-Output ("GUI SERVER EXITED with code " + $p3.ExitCode)
              Get-Content "server3.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
              Get-Content "server3.err" -ErrorAction SilentlyContinue | Select-Object -Last 25
              throw "gui-mode server exited"
            }
            try {
              $alive = Invoke-WebRequest -Uri "http://127.0.0.1:18083/internal-stats" -UseBasicParsing -TimeoutSec 5
            } catch {
              Start-Sleep -Milliseconds 250
            }
          }
          try {
            if (-not $alive) { throw "gui-mode server never answered on 18083" }
            Start-Sleep -Seconds 2
            $p3.Refresh()
            if ($p3.HasExited) { throw "gui-mode server died after serving its first request" }
            Write-Output "gui-mode process alive and serving 18083 OK"
            & ./tools/inspect-ui.ps1 -GuiProcessId $p3.Id -OutputDirectory ui-review -ResourceDirectory $res3
          } finally {
            Get-Process -Name webserver -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

