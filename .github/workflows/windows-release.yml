      - name: Upload desktop UI screenshots and layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-review
          path: ui-review/**
          if-no-files-found: warn

      - name: Regression test separate stable and preview installations can both open GUIs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'gui-instance-isolation'
          $stable = Join-Path $root 'ADBlock'
          $preview = Join-Path $root 'ADBlockPreview'
          New-Item -ItemType Directory -Force -Path $stable, $preview | Out-Null
          Copy-Item -Path 'dist/*' -Destination $stable -Recurse -Force
          Copy-Item -Path 'dist/*' -Destination $preview -Recurse -Force
          Set-Content (Join-Path $stable 'webserver.ini') "[settings]`nautomatic_update=0" -Encoding ascii
          Set-Content (Join-Path $preview 'webserver.ini') "[settings]`nautomatic_update=0" -Encoding ascii
          $a = $null
          $b = $null
          try {
            $stableRes = Join-Path $stable 'resources'
            $previewRes = Join-Path $preview 'resources'
            $stableExe = Join-Path $stable 'webserver.exe'
            $previewExe = Join-Path $preview 'webserver.exe'
            $argsA = @('--resources', "`"$stableRes`"", '--bind', 'loopback',
                       '--http-port', '18220', '--https-port', '18221', '--stats-port', '18222')
            $argsB = @('--resources', "`"$previewRes`"", '--bind', 'loopback',
                       '--http-port', '18230', '--https-port', '18231', '--stats-port', '18232')
            $a = Start-Process -FilePath $stableExe -WorkingDirectory $stable -ArgumentList $argsA -PassThru
            $b = Start-Process -FilePath $previewExe -WorkingDirectory $preview -ArgumentList $argsB -PassThru
            $deadline = (Get-Date).AddSeconds(35)
            $ok = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $a.Refresh()
              $b.Refresh()
              if ($a.HasExited -or $b.HasExited) {
                throw "One installation exited unexpectedly: stable=$($a.HasExited), preview=$($b.HasExited)"
              }
              $wA = (Get-Process -Id $a.Id -ErrorAction SilentlyContinue).MainWindowHandle
              $wB = (Get-Process -Id $b.Id -ErrorAction SilentlyContinue).MainWindowHandle
              if ($wA -ne 0 -and $wB -ne 0) { $ok = $true; break }
            }
            if (-not $ok) { throw 'Two separate installed GUI windows were not created' }
            $again = Start-Process -FilePath $stableExe -WorkingDirectory $stable -ArgumentList $argsA -PassThru -Wait
            if ($again.ExitCode -ne 0) { throw 'Second same-install invocation should hand off cleanly' }
            $a.Refresh()
            $b.Refresh()
            if ($a.HasExited -or $b.HasExited) { throw 'Same-install invocation killed an existing GUI' }
            Write-Host 'PASS: Independent installations show distinct GUIs; duplicate same-install start exits cleanly'
          } finally {
            foreach ($p in @($a, $b)) {
              if ($p) {
                $p.Refresh()
                if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
              }
            }
          }

      - name: Port-conflict test (management port must survive a busy main port)
        shell: pwsh
        run: |
          $res4 = (Resolve-Path "dist\resources").Path
          # Occupy 18084 so the server cannot bind its main HTTP port.
          $blocker = Start-Job -ScriptBlock {
            $l = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 18084)
            $l.Start()
            Start-Sleep -Seconds 90
          }
          # Wait until the blocker really listens (the job needs a moment to
          # start) instead of a flat 5 s.
          $blocked = $false
          $deadlineB = (Get-Date).AddSeconds(15)
          while (-not $blocked -and (Get-Date) -lt $deadlineB) {
            try {
              $probe = [System.Net.Sockets.TcpClient]::new()
              $probe.Connect("127.0.0.1", 18084)
              $probe.Close()
              $blocked = $true
            } catch {
              Start-Sleep -Milliseconds 200
            }
          }
          if (-not $blocked) { throw "port 18084 was never taken by the blocker job" }
          # GUI mode on purpose: the dashboard must stay alive and keep the
          # loopback management port serving even when the main port is taken
          # (headless --no-gui exits fast instead, which is checked at the end).
          $p4 = Start-Process -FilePath "dist\webserver.exe" -ArgumentList @("--resources",$res4,"--http-port","18084","--https-port","18447") -PassThru -WorkingDirectory "dist" -RedirectStandardOutput "server4.log" -RedirectStandardError "server4.err"
          # The dashboard must come up with bind_ok=false; poll for that state
          # instead of sleeping 12 s and hoping.
          $s4 = $null
          $deadline4 = (Get-Date).AddSeconds(25)
          while (-not $s4 -and (Get-Date) -lt $deadline4) {
            if ($p4.HasExited) {
              Get-Content "server4.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
              Get-Content "server4.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
              throw "dashboard exited instead of surviving the busy main port"
            }
            try {
              $probe4 = Invoke-WebRequest -Uri "http://127.0.0.1:8686/internal-stats" -UseBasicParsing -TimeoutSec 5
              if ($probe4.StatusCode -eq 200 -and $probe4.Content -match '"bind_ok"\s*:\s*false') {
                $s4 = $probe4
              } else {
                Start-Sleep -Milliseconds 250
              }
            } catch {
              Start-Sleep -Milliseconds 250
            }
          }
          try {
            if (-not $s4) { throw "management port never reported bind_ok=false on a busy main port" }
            Write-Output ("busy-main-port: management /internal-stats HTTP " + $s4.StatusCode)
            if ($s4.StatusCode -ne 200) { throw "management port is dead while the main port is busy" }
            if ($s4.Content -notmatch '"bind_ok"\s*:\s*false') { throw "expected bind_ok=false when the main HTTP port is taken" }
            if ($s4.Content -notmatch '"bound"\s*:\s*false') { throw "expected a listener entry with bound=false" }
            $err4 = Get-Content "server4.err" -ErrorAction SilentlyContinue | Out-String
            if ($err4 -notmatch 'already in use') { throw "the conflict was not reported in webserver.log/stderr" }
            Write-Output "port-conflict handling OK (dashboard alive, bind_ok=false, warning logged)"
          } catch {
            Write-Output ("PORT CONFLICT TEST ERROR: " + $_.Exception.Message)
            Get-Content "server4.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
            Get-Content "server4.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
            throw
          } finally {
            Get-Process -Name webserver -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Stop-Job $blocker -ErrorAction SilentlyContinue
            Remove-Job $blocker -Force -ErrorAction SilentlyContinue
          }
          # Wait until the loopback management port is really free again: a
          # lingering listener would make the headless instance below take the
          # "another instance is already running" path and exit 0, which would
          # hide a real bind failure.
          $released = $false
          $deadlineR = (Get-Date).AddSeconds(10)
          while (-not $released -and (Get-Date) -lt $deadlineR) {
            try {
              $probeR = [System.Net.Sockets.TcpClient]::new()
              $probeR.Connect("127.0.0.1", 8686)
              $probeR.Close()
              Start-Sleep -Milliseconds 200
            } catch {
              $released = $true
            }
          }
          if (-not $released) { throw "the management port 8686 stayed busy after stopping the dashboard" }
          # Headless mode is expected to fail fast when the port is taken
          # (a scheduled task should report the problem instead of idling).
          #
          # NOTE: the blocker above was already stopped by the finally block and
          # 18084 is free again, so this check needs its OWN busy port. Without
          # it the server binds normally, keeps running, and "it exited" can
          # only be asserted by killing it first - which is what the original
          # test did, making the assertion pass no matter what.
          $blocker2 = Start-Job -ScriptBlock {
            $l = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 18085)
            $l.Start()
            Start-Sleep -Seconds 90
          }
          $blocked2 = $false
          $deadlineB2 = (Get-Date).AddSeconds(15)
          while (-not $blocked2 -and (Get-Date) -lt $deadlineB2) {
            try {
              $probe2 = [System.Net.Sockets.TcpClient]::new()
              $probe2.Connect("127.0.0.1", 18085)
              $probe2.Close()
              $blocked2 = $true
            } catch {
              Start-Sleep -Milliseconds 200
            }
          }
          if (-not $blocked2) { throw "port 18085 was never taken by the second blocker job" }
          $sw5 = [System.Diagnostics.Stopwatch]::StartNew()
          $p5 = Start-Process -FilePath "dist\webserver.exe" -ArgumentList @("--resources",$res4,"--http-port","18085","--https-port","18448","--no-gui") -PassThru -WorkingDirectory "dist" -RedirectStandardOutput "server5.log" -RedirectStandardError "server5.err"
          $exitedByItself = $p5.WaitForExit(20000)
          $sw5.Stop()
          Get-Process -Name webserver -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Job $blocker2 -ErrorAction SilentlyContinue
          Remove-Job $blocker2 -Force -ErrorAction SilentlyContinue
          # Assert it left on its own: Stop-Process above would otherwise make
          # HasExited true and the check would pass no matter what.
          if (-not $exitedByItself) { throw "headless mode did not exit within 20s when the main port was taken" }
          Write-Output ("headless mode exited by itself after {0:N1}s with code {1}" -f $sw5.Elapsed.TotalSeconds, $p5.ExitCode)

      - name: Autostart registry test
        shell: pwsh
        run: |
          $res2 = (Resolve-Path "dist\resources").Path
          $pI = Start-Process -FilePath "dist\webserver.exe" -ArgumentList @("--resources",$res2,"--http-port","18082","--https-port","18445","--no-gui","--install-autostart") -Wait -PassThru
          if ($pI.ExitCode -ne 0) { throw "install-autostart exited with code $($pI.ExitCode)" }
          $exists1 = $false
          try { $null = Get-ItemPropertyValue -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "ADBlockWebServer" -ErrorAction Stop; $exists1 = $true } catch { $exists1 = $false }
          if (-not $exists1) { throw "autostart key not found after install" }
          $run = Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "ADBlockWebServer" -ErrorAction SilentlyContinue
          Write-Output ("autostart installed: " + $run.ADBlockWebServer)
          if ($run.ADBlockWebServer -notmatch '--minimized') { throw "autostart command lacks --minimized (window would never show)" }
          if ($run.ADBlockWebServer -notmatch '--resources') { throw "autostart command lacks saved resource directory" }
          if ($run.ADBlockWebServer -match '--(stats-port|http-port|https-port|bind)') { throw "autostart command would override persisted listener settings" }
          $pU = Start-Process -FilePath "dist\webserver.exe" -ArgumentList @("--resources",$res2,"--http-port","18082","--https-port","18445","--no-gui","--uninstall-autostart") -Wait -PassThru
          if ($pU.ExitCode -ne 0) { throw "uninstall-autostart exited with code $($pU.ExitCode)" }
          $exists2 = $false
          try { $null = Get-ItemPropertyValue -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "ADBlockWebServer" -ErrorAction Stop; $exists2 = $true } catch { $exists2 = $false }
          if ($exists2) { throw "autostart key still present after uninstall" }
          Write-Output "autostart uninstalled OK"

      - name: Code-sign webserver.exe (when signing secrets are configured)
        shell: msys2 {0}
        env:
          SIGN_CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          SIGN_CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ "$WINDOWS_UNSIGNED_RELEASE" = "1" ]; then
            echo "::warning::UNSIGNED WINDOWS RELEASE: Authenticode intentionally skipped; leave Windows security protections enabled"
            exit 0
          fi
          if [ -z "$SIGN_CERT_B64" ] || [ -z "$SIGN_CERT_PASS" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
               [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::Signed Windows release requires original production PFX and password"
              exit 1
            fi
            case "$GITHUB_REF" in
              refs/tags/progress-win-*|refs/heads/preview/release-*)
                echo "::error::preview publication requires the existing production PFX"; exit 1;;
            esac
            echo "no signing certificate configured - skipping sign for ordinary CI"
            exit 0
          fi
          pacman -S --noconfirm --needed mingw-w64-x86_64-osslsigncode
          echo "$SIGN_CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          osslsigncode sign -pkcs12 "$RUNNER_TEMP/cert.pfx" -pass "$SIGN_CERT_PASS" -h sha256 \
            -n "ADBlock Web Server" -i "https://github.com/wxcvm/AdAway-Windows" \
            -in dist/webserver.exe -out dist/webserver.signed.exe
          mv dist/webserver.signed.exe dist/webserver.exe
          # A plain "verify" builds the trust store from the runner's CA bundle,
          # and a self-signed certificate is not in it - so verification always
          # failed with "Failed to add store lookup file / Signature
          # verification: failed" even though the signature was fine (that is
          # what broke every release after the signing secrets were added).
          # Verify against the certificate that signed the file instead; the
          # signature itself stays mandatory (sign + mv above fail the step).
          if openssl pkcs12 -in "$RUNNER_TEMP/cert.pfx" -clcerts -nokeys \
               -passin "pass:$SIGN_CERT_PASS" -out "$RUNNER_TEMP/cert.pem" 2>/dev/null; then
            osslsigncode verify -CAfile "$RUNNER_TEMP/cert.pem" \
              dist/webserver.exe \
              && echo "signed OK (verified against the signing certificate)" \
              || echo "::warning::signature present but not verifiable against cert.pem"
          else
            echo "::warning::could not extract the signing certificate for verification"
          fi

      - name: Prepare isolated preview launchers and inspection documentation
        if: env.ADBLOCK_PREVIEW_BUILD == '1'
        shell: pwsh
        run: |
          $launcher = '@echo off' + "`r`n" + 'cd /d "%~dp0"' + "`r`n" + 'webserver.exe --resources "%~dp0resources" --bind loopback --http-port 18080 --https-port 18443 --stats-port 18686' + "`r`n"
          Set-Content -LiteralPath dist/start-preview.bat -Value $launcher -Encoding ascii
          Set-Content -LiteralPath dist/start.bat -Value $launcher -Encoding ascii
          # These batch scripts are part of the portable installation path.
          # The program rejects --bind loop at CLI parsing, before GUI startup.
          foreach ($launcherFile in @('dist/start.bat','dist/start-preview.bat')) {
            $actual = Get-Content -LiteralPath $launcherFile -Raw
            if ($actual -notmatch '--bind loopback' -or $actual -match '--bind loop(?!back)') {
              throw "Invalid portable launcher CLI option in $launcherFile"
            }
          }
          Copy-Item -LiteralPath docs/preview-installation.md -Destination dist/README.txt -Force
          Get-Content -LiteralPath docs/m1-rule-loader-validation.md,docs/tcp-backend.md | Set-Content -LiteralPath dist/IMPLEMENTATION-STATUS.md -Encoding utf8

      - name: Package zip
        shell: bash
        run: |
          cd dist
          # SECURITY (audit REL-1 / W5-05): the smoke tests above generated a CA
          # key and runtime state inside dist\resources. Shipping those would
          # give every user the SAME publicly downloadable CA private key
          # (silent MITM for anyone who trusts it).
          #
          # Every path below used to be written relative to the repository root
          # while this step had already cd'ed into dist, so each rm and the
          # verification ls pointed at a non-existent path: rm -f and the pipe
          # swallowed that, and the key WAS packaged. They are relative to the
          # current directory now, and the list covers everything the server
          # writes - including the localhost leaf key that the restored leaf
          # reuse persists, the control token and the CA rotation state.
          rm -f resources/localhost-2410.key \
                resources/localhost-2410.crt \
                resources/localhost-leaf.key \
                resources/localhost-leaf.crt \
                resources/*.dat \
                resources/stats.json \
                resources/update_cache.json \
                resources/control_token.txt \
                resources/ca_rotation.json \
                resources/allowlist.txt \
                resources/blocklist.txt \
                resources/cosmetic.css \
                resources/webserver.log resources/webserver.log.1 \
                resources/crash.log \
                webserver.log webserver.log.1 crash.log
          leftover=$(ls resources/localhost-2410.key resources/localhost-leaf.key \
                        resources/*.dat resources/stats.json resources/update_cache.json \
                        resources/control_token.txt resources/ca_rotation.json \
                        resources/webserver.log webserver.log 2>/dev/null || true)
          if [ -n "$leftover" ]; then
            echo "::error::release package still contains key material or runtime state: $leftover"
            exit 1
          fi
          if [ -f resources/subscription_urls.txt ] && grep -Eq 'https://example[.]test/(hosts|allow|extra)' resources/subscription_urls.txt; then
            echo "::error::UI inspection fixture subscriptions leaked into the package"; exit 1
          fi
          if [ -f resources/subscriptions.txt ] && grep -Fq 'ads.removal-fixture.invalid' resources/subscriptions.txt; then
            echo "::error::UI inspection fixture rules leaked into the package"; exit 1
          fi
          if [ -f webserver.ini ]; then
            echo "::error::Smoke-test GUI preferences leaked into the package"; exit 1
          fi
          powershell -NoProfile -Command "Compress-Archive -Path .\* -DestinationPath '$GITHUB_WORKSPACE\adblock-webserver-win64.zip' -Force"
          ls -la "$GITHUB_WORKSPACE/adblock-webserver-win64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adblock-webserver-win64
          path: adblock-webserver-win64.zip
          if-no-files-found: error

      - name: Verify preview shortcut argument contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- '--bind loopback' installer-preview.iss
          if grep -Fq -- '--bind loop --' installer-preview.iss; then
            echo "::error::Preview shortcut uses rejected --bind loop; use loopback"
            exit 1
          fi

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if ($env:ADBLOCK_PREVIEW_BUILD -eq '1') {
            & $compiler installer-preview.iss
            if ($LASTEXITCODE -ne 0) { throw 'per-user preview installer build failed' }
            & $compiler /DMachineInstall=1 installer-preview.iss
            if ($LASTEXITCODE -ne 0) { throw 'all-users preview installer build failed' }
            # UI PRs must also compile the REAL stable installer; otherwise
            # a valid preview package could hide a broken official package.
            & $compiler installer.iss
            if ($LASTEXITCODE -ne 0) { throw 'stable installer build failed on PR' }
          } else {
            & $compiler installer.iss
            if ($LASTEXITCODE -ne 0) { throw 'installer build failed' }
          }
          Get-ChildItem dist-installer

      - name: Test production identity in-place upgrade and preserved data
        shell: pwsh
        run: ./tools/test-inplace-install.ps1

      - name: Smoke-test installed preview executable with real GUI
        if: env.ADBLOCK_PREVIEW_BUILD == '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'PreviewCiStartup'
          $installer = (Resolve-Path 'dist-installer/adblock-preview-user-x64.exe').Path
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$base") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Preview install failed: $($install.ExitCode)" }
          $exe = Join-Path $base 'webserver.exe'
          if (-not (Test-Path $exe)) { throw 'Preview executable missing' }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\ADBlock Preview\ADBlock Preview.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Start Menu shortcut was not installed' }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          if ($link.TargetPath -ine $exe) { throw 'Shortcut points to wrong executable' }
          if ($link.WorkingDirectory -ine $base) { throw 'Shortcut working directory is wrong' }
          if ($link.Arguments -notmatch '--bind loopback' -or $link.Arguments -notmatch '--resources') {
            throw 'Shortcut is missing working server arguments'
          }
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'ADBlock Preview.lnk'
          if (-not (Test-Path $desktop)) { throw 'Desktop shortcut was not created by default' }
          foreach ($iss in @('installer.iss','installer-preview.iss')) {
            $cfg = Get-Content $iss -Raw
            if ($cfg -notmatch 'DefaultDirName=\{code:PreferredInstallDir\}' -or
                -not $cfg.Contains("DirExists('D:\')") -or
                $cfg -notmatch 'Flags: postinstall nowait skipifsilent') {
              throw "D-drive fallback or launch-after-install configuration missing: $iss"
            }
          }
          $res = Join-Path $base 'resources'
          $args = @('--resources', "`"$res`"", '--bind','loopback',
                    '--http-port','18764','--https-port','18465','--stats-port','18685')
          $process = Start-Process -FilePath $exe -WorkingDirectory $base -ArgumentList $args -PassThru
          try {
            Start-Sleep -Seconds 9
            $process.Refresh()
            if ($process.HasExited) { throw "Preview GUI exited on startup: $($process.ExitCode)" }
            if ((Get-Process -Id $process.Id -ErrorAction Stop).MainWindowHandle -eq 0) {
              throw 'Preview GUI did not open a visible window'
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Verify production signer parity and sign in-place preview installer
        if: env.WINDOWS_UNSIGNED_RELEASE != '1' && (startsWith(github.ref, 'refs/tags/progress-win-') || startsWith(github.ref, 'refs/heads/preview/release-'))
        shell: msys2 {0}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          SIGN_CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGN_CERT_B64" && test -n "$SIGN_CERT_PASS"
          reference="$RUNNER_TEMP/prod-win-reference"
          mkdir -p "$reference"
          gh release download win11-webserver-v1.74 --repo "$GITHUB_REPOSITORY" \
            --pattern 'adblock-webserver-win64.zip' --dir "$reference"
          unzip -j "$reference/adblock-webserver-win64.zip" 'webserver.exe' -d "$reference"
          test -s "$reference/webserver.exe"
          pfx="$RUNNER_TEMP/preview-win-signing.pfx"
          pem="$RUNNER_TEMP/preview-win-signing.pem"
          trap 'rm -f "$pfx" "$pem"' EXIT
          umask 077
          printf '%s' "$SIGN_CERT_B64" | base64 -d > "$pfx"
          openssl pkcs12 -in "$pfx" -clcerts -nokeys \
            -passin "pass:$SIGN_CERT_PASS" -out "$pem"
          test -s "$pem"
          # Verify the actual previously published production binary's
          # Authenticode signature under the SAME signing certificate.
          osslsigncode verify -CAfile "$pem" "$reference/webserver.exe" \
            || { echo "::error::production Windows EXE is not signed by the configured preview signer"; exit 1; }
          osslsigncode verify -CAfile "$pem" dist/webserver.exe \
            || { echo "::error::current preview webserver executable signature invalid"; exit 1; }
          for label in inplace; do
            exe="dist-installer/adblock-webserver-setup.exe"
            test -s "$exe"
            osslsigncode sign -pkcs12 "$pfx" -pass "$SIGN_CERT_PASS" -h sha256 \
              -n "ADBlock Preview" -i "https://github.com/wxcvm/AdAway-Windows" \
              -in "$exe" -out "$exe.signed"
            mv "$exe.signed" "$exe"
            osslsigncode verify -CAfile "$pem" "$exe" \
              || { echo "::error::preview installer signature verification failed: $label"; exit 1; }
          done
          openssl x509 -in "$pem" -noout -fingerprint -sha256

      - name: Verify original production signature and sign official installer
        if: env.WINDOWS_UNSIGNED_RELEASE != '1' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: msys2 {0}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          SIGN_CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGN_CERT_B64" && test -n "$SIGN_CERT_PASS"
          reference="$RUNNER_TEMP/production-signer-reference"
          mkdir -p "$reference"
          gh release download win11-webserver-v1.74 --repo "$GITHUB_REPOSITORY" \
            --pattern 'adblock-webserver-win64.zip' --dir "$reference"
          unzip -j "$reference/adblock-webserver-win64.zip" 'webserver.exe' -d "$reference"
          test -s "$reference/webserver.exe"
          pfx="$RUNNER_TEMP/stable-signing.pfx"
          pem="$RUNNER_TEMP/stable-signing.pem"
          trap 'rm -f "$pfx" "$pem"' EXIT
          umask 077
          printf '%s' "$SIGN_CERT_B64" | base64 -d > "$pfx"
          openssl pkcs12 -in "$pfx" -clcerts -nokeys \
            -passin "pass:$SIGN_CERT_PASS" -out "$pem"
          test -s "$pem"
          osslsigncode verify -CAfile "$pem" "$reference/webserver.exe"
          osslsigncode verify -CAfile "$pem" dist/webserver.exe
          installer="dist-installer/adblock-webserver-setup.exe"
          test -s "$installer"
          osslsigncode sign -pkcs12 "$pfx" -pass "$SIGN_CERT_PASS" -h sha256 \
            -n "ADBlock Web Server" -i "https://github.com/wxcvm/AdAway-Windows" \
            -in "$installer" -out "$installer.signed"
          mv "$installer.signed" "$installer"
          osslsigncode verify -CAfile "$pem" "$installer"
          echo "Official EXE and installer match the previously published Windows signing certificate"

      # Publishing is push/dispatch only: a pull_request run must never create
      # or overwrite a public release. Unsigned releases must be prominently
      # identified and never advertised as signed/SmartScreen-trusted.
      - name: Upload typed-rule inspection binaries (PR artifact only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: windows-typed-rules-inspection
          path: |
            adblock-webserver-win64.zip
            dist-installer/adblock-preview-user-x64.exe
            dist-installer/adblock-preview-machine-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows Release (ZIP and installer; unsigned when configured)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          : "${TAG:?TAG env var missing}"
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Official release $TAG already exists; refusing to replace signed assets"
            exit 1
          fi
          test -s adblock-webserver-win64.zip
          test -s dist-installer/adblock-webserver-setup.exe
          # SHA-256 is particularly important for unsigned releases:
          # it verifies the artifact bytes, but it does not establish publisher trust.
          sha256sum adblock-webserver-win64.zip dist-installer/adblock-webserver-setup.exe > SHA256SUMS.txt
          gh release create "$TAG" adblock-webserver-win64.zip \
            dist-installer/adblock-webserver-setup.exe SHA256SUMS.txt --repo "${{ github.repository }}" \
            --latest \
            --title "ADBlock Windows v1.75 (x64 · 未签名)" \
            --notes "Windows 1.75 正式构建（未签名）：默认优先安装到 D:\\ADBlock（无 D 盘时回退到用户目录），支持开始菜单/桌面快捷方式、完成后启动。此版本的 EXE 和安装器不带 Authenticode 数字签名，Windows 可能拒绝执行；请勿为使用本软件关闭 Defender、SmartScreen 或智能应用控制。支持现有过滤和监听；TUN/WFP 全局接管、AdGuard 自动协同仍未实现。"
        env:
          GH_TOKEN: ${{ github.token }}

      # This is now a standalone Windows repository. A successful official
      # release must be the repository's latest release; never demote it in
      # favor of an Android asset in another repository.

      # The in-app updater checks the PUBLIC feed repository (this one is
      # private, so its release API cannot be read without a token).
      # Skipped silently when DOH_ECH_TOKEN is not configured.
      - name: Publish zip to the public update feed (wxcvm/Doh-ECH)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          FEED_TOKEN: ${{ secrets.DOH_ECH_TOKEN }}
        run: |
          if [ -z "$FEED_TOKEN" ]; then
            echo "DOH_ECH_TOKEN is not configured - skipping public feed publish."
            exit 0
          fi
          : "${TAG:?TAG env var missing}"
          ZIP=$(find . -name 'adblock-webserver-win64.zip' | head -1)
          if [ -z "$ZIP" ]; then echo "no zip found"; exit 0; fi
          export GH_TOKEN="$FEED_TOKEN"
          VERSION="${TAG#win11-webserver-v}"
          gh release create "$TAG" "$ZIP" --repo wxcvm/Doh-ECH \
            --title "ADBlock Windows 服务器 v$VERSION" \
            --notes "Windows 端一键更新版（自动检查/下载/替换/重启）" \
            || gh release upload "$TAG" "$ZIP" --repo wxcvm/Doh-ECH --clobber

      # The in-app updater reads this fixed-tag manifest instead of the REST API
      # (60 requests/hour per IP) - see UPDATE_MANIFEST_PATH in update_win32.c.
      - name: Publish windows-manifest.json (fixed tag win11-latest)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXE=dist-installer/adblock-webserver-setup.exe
          ZIP="$GITHUB_WORKSPACE/adblock-webserver-win64.zip"
          # GNU coreutils prefixes the digest line with '\' (and escapes the
          # name) when the path contains a backslash, which a Windows runner's
          # $GITHUB_WORKSPACE always does. "cut -f1" kept that marker, so the
          # published manifest carried "sha256:\<hex>" - not valid JSON (strict
          # parsers reject the whole file) and not a usable digest either.
          sha_of() { sha256sum -- "$1" | awk '{print $1}' | tr -d '\\'; }
          ZIP_SHA=""
          if [ -f "$ZIP" ]; then ZIP_SHA=$(sha_of "$ZIP"); fi
          EXE_SHA=""
          if [ -f "$EXE" ]; then EXE_SHA=$(sha_of "$EXE"); fi
          if [ -z "$ZIP_SHA" ]; then
            echo "::error::portable zip missing - refusing to publish a manifest"; exit 1
          fi
          # A failed Inno build used to abort this step silently, so the fixed
          # tag kept advertising the PREVIOUS version and every client reported
          # "已是最新" while a newer build existed. Publish zip-only instead:
          # the updater falls back to the portable package.
          if [ -z "$EXE_SHA" ]; then
            echo "::warning::installer missing - publishing a zip-only manifest"
          fi
          VER="${TAG#win11-webserver-v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          python3 - "$TAG" "$VER" "$BASE" "$EXE_SHA" "$ZIP_SHA" > windows-manifest.json <<'PYEOF'
          import datetime, json, os, sys
          tag, ver, base, exe_sha, zip_sha = sys.argv[1:6]
          doc = {
              "tag": tag,
              "version": ver,
              "build": os.environ['GITHUB_RUN_ID'],
              "exe": "adblock-webserver-setup.exe" if exe_sha else "",
              "exe_url": "%s/adblock-webserver-setup.exe" % base if exe_sha else "",
              "exe_sha256": "sha256:%s" % exe_sha if exe_sha else "",
              "zip_url": "%s/adblock-webserver-win64.zip" % base,
              "zip_sha256": "sha256:%s" % zip_sha,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          json.dump(doc, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PYEOF
          # Parse it with a strict JSON reader before publishing, so a corrupt
          # manifest fails the run instead of stranding every installed client.
          python3 - <<'PYEOF'
          import json
          doc = json.load(open("windows-manifest.json", encoding="utf-8"))
          assert doc["zip_sha256"].startswith("sha256:") and len(doc["zip_sha256"]) == 71, doc
          if doc["exe_sha256"]:
              assert len(doc["exe_sha256"]) == 71, doc
          print("manifest verified: version=%s zip=%s exe=%s" % (
              doc["version"], doc["zip_sha256"][:14], doc["exe_sha256"][:14] or "none"))
          PYEOF
          cat windows-manifest.json
          gh release view win11-latest --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create win11-latest --repo "${{ github.repository }}" \
            --latest=false \
                 --title "Windows 最新版（固定标签）" \
                 --notes "固定标签：windows-manifest.json 每次发布时由 CI 覆盖，应用内更新直接读它，不经过 GitHub API，因此不受 60 次/小时限流影响。"
          gh release upload win11-latest windows-manifest.json --repo "${{ github.repository }}" --clobber
          # This release only carries the manifest; it must never be "latest"
          # either, or releases/latest/download/<apk> resolves to it (W5-04).
          gh release edit win11-latest --repo "${{ github.repository }}" --latest=false \
            && echo "win11-latest is not the latest release" || true
          # ── Remote verification (audit item 68) ───────────────────────────
          # The job used to stop right here, so "the release is published but
          # the fixed tag still advertises the previous build" was only ever
          # noticed by a user pressing 检查更新. Fetch the manifest back
          # through the CDN - cache-busted exactly like the updater does, since
          # a clobbered asset answers with the previous copy for a few minutes -
          # and assert that it really is this tag. Retries instead of failing on
          # the first attempt, because the CDN needs a moment.
          URL="https://github.com/${{ github.repository }}/releases/download/win11-latest/windows-manifest.json"
          verified=0
          for attempt in 1 2 3 4 5 6 7 8; do
            payload=$(curl -fsSL "$URL?t=$(date +%s)-$attempt" || true)
            tag=$(printf '%s' "$payload" | python3 -c \
                    "import json,sys; print(json.load(sys.stdin).get('tag',''))" \
                    2>/dev/null || true)
            if [ "$tag" = "$TAG" ]; then verified=1; break; fi
            echo "manifest not updated yet (attempt $attempt, tag='$tag')"
            sleep 20
          done
          if [ "$verified" != 1 ]; then
            echo "::error::the published win11-latest manifest does not advertise $TAG - clients would see the previous build"
            exit 1
          fi
          echo "remote manifest verified: $TAG"

      # Keep the release list readable without ever touching what clients read:
      # only CI-created win11-webserver-v<major>.<minor> releases beyond the
      # newest five are deleted, win11-latest (the fixed tag the updater reads)
      # and hand-made releases are never candidates. Best effort on purpose -
      # the release itself is already published at this point, so a failure here
      # must not turn a good release red.
      - name: Prune old Windows releases (keep newest 5)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/old-win-releases.txt
          gh release list --repo "${{ github.repository }}" --limit 100 \
              --json tagName,isDraft \
            | python3 -c "
          import json, re, sys
          rels = [r for r in json.load(sys.stdin)
                  if not r['isDraft']
                  and re.fullmatch(r'win11-webserver-v[0-9]+\.[0-9]+', r['tagName'])]
          rels.sort(key=lambda r: tuple(int(x) for x in
                                         r['tagName'].rsplit('v', 1)[1].split('.')),
                    reverse=True)
          print('\n'.join(r['tagName'] for r in rels[5:]))
          " >> /tmp/old-win-releases.txt 2>/dev/null || true
          while read -r tag; do
            if [ -n "$tag" ]; then
              echo "pruning $tag"
              gh release delete "$tag" --repo "${{ github.repository }}" \
                --cleanup-tag --yes || true
            fi
          done < /tmp/old-win-releases.txt
      - name: Publish progress inspection prerelease
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/progress-win-') || startsWith(github.ref, 'refs/heads/preview/release-'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish-progress-preview.sh

  log-client-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Test production page parser and navigation under ASan and UBSan
        shell: bash
        run: |
          bash fetch-upstream.sh
          cc -std=c11 -O1 -g -D_GNU_SOURCE -DMG_TLS=0 -fsanitize=address,undefined -fno-omit-frame-pointer -Ijni -c jni/mongoose/mongoose.c -o log-mongoose.o
          for test in query_log_page query_log_navigation; do
            cc -std=c11 -O1 -g -D_GNU_SOURCE -DMG_TLS=0 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -Ijni "${test}_test.c" log-mongoose.o -pthread -o "$test"
            "./$test"
          done
          bash fetch-log-contract.sh
          python3 tools/build-rule-core.py jni/webserver.c stats-bounds-core.c
          python3 log-contract/stats-json-bounds-fixture.py stats-bounds-core.c stats-bounds-test.c
          cc -std=c11 -O1 -g -D_GNU_SOURCE -DMG_TLS=0 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -Ijni stats-bounds-test.c log-mongoose.o -pthread -o stats-bounds-test
          ./stats-bounds-test
